<!DOCTYPE html>
<html lang="en-US">

  <head>
    <script>
      fetch('src/head.html')
        .then(response => response.text())
        .then(data => document.querySelector('head').innerHTML = data);
    </script>
  </head>

  <body>
    <div id="header"></div>
    <div id="torso"></div>
    <div id="footer"></div>

    <script src="src/scripts.js"></script>

    <script>
      fetch('src/header.html')
        .then(r => r.text())
        .then(html => { document.querySelector('#header').innerHTML = html; });
    </script>

    <script>
      fetch('src/briefcase.html')
        .then(r => r.text())
        .then(html => { document.querySelector('#torso').innerHTML = html; });
    </script>

    <script>
      fetch('src/footer.html')
        .then(r => r.text())
        .then(html => { document.querySelector('#footer').innerHTML = html; });
    </script>
  </body>

</html>
